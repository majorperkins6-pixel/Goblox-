<!DOCTYPE html>
<html>
<head>
  <title>Goblox</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 40px;
    }

    header p {
      margin: 8px 0 0;
    }

    .container {
      padding: 25px;
      max-width: 900px;
      margin: auto;
    }

    .welcome {
      background: white;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 3px 10px #ccc;
    }

    .games {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 25px;
    }

    .game {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 3px 10px #ccc;
      text-align: center;
    }

    button {
      background: #e91e63;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #c2185b;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #666;
    }
  </style>
</head>

<body>

  <header>
    <h1>🎮 Goblox</h1>
    <p>Play • Create • Connect</p>
  </header>

  <div class="container">

    <div class="welcome">
      <h2>Welcome to Goblox!</h2>
      <p>Discover games, create your own, and have fun.</p>
      <button onclick="alert('Welcome to Goblox!')">
        Start Playing
      </button>
    </div>

    <h2>🔥 Featured Games</h2>

    <div class="games">

      <div class="game">
        <h3>🏃 Goblox Run</h3>
        <p>Run, jump, and avoid obstacles!</p>
        <button onclick="alert('Goblox Run is starting!')">
          Play
        </button>
      </div>

      <div class="game">
        <h3>🏗️ Build World</h3>
        <p>Build your own amazing world.</p>
        <button onclick="alert('Build World is starting!')">
          Play
        </button>
      </div>

      <div class="game">
        <h3>⚔️ Battle Arena</h3>
        <p>Enter the arena and compete!</p>
        <button onclick="alert('Battle Arena is starting!')">
          Play
        </button>
      </div>

    </div>
  </div>

  <footer>
    © 2026 Goblox
  </footer>

</body>
</html>
